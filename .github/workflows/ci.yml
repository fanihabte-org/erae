name: "ERAE dbt"
on:
  pull_request:
  push:
    branches: [ 'main' ]

jobs:
  build:
    name: Build and test dbt
    runs-on: ubuntu-latest

    steps:
      - name: Pull down the repository
        uses: actions/checkout@v7

      - name: Install Just
        uses: extractions/setup-just@v3

      - name: Install dbt dependencies
        run: |
          just deps

      - name: Test dbt models structures
        run: |
          just ci

      - if: always()
        run: just down

  deploy:
    name: Deploy to prod
    needs: build
    runs-on: [ self-hosted, linux, x64 ]
    env:
      PROJECT_DIR: ${{ secrets.PROJECT_DIR }}
    steps:
      - name: Pull down the repository
        uses: actions/checkout@v7

      - name: Install Just
        uses: extractions/setup-just@v3

      - name: Restart docker
        run: |
          cd "$PROJECT_DIR"
          docker compose run --rm dbt run
